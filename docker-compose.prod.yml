# Production overlay. Apply on top of docker-compose.yml on the VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes vs the dev compose:
# - api joins the shared `web` Docker network so the host's Caddy can
#   reverse_proxy to it by service name. db and redis stay on the
#   default (project-private) network — only the api is reachable from
#   outside the project's network namespace.
# - All three services get `restart: unless-stopped` so the VM survives
#   a reboot or a transient crash.
# - Host port bindings are stripped on every service. Caddy publishes the
#   only public ingress (443/80 on its own container); db / redis / api
#   listen only on the Docker network. This matches the HOSTING.md
#   convention and the postgres-ports leak warning from harmonia.
# - api builds the `prod` Dockerfile stage (no --reload, no dev deps,
#   source baked into the image).
# - Source bind-mount is dropped — the image's own code is what runs.

services:
  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    # The prod image bakes in the source and drops the bind-mount, so the
    # app can't read a .env off disk the way it does in dev. Inject the
    # deployment secrets (pepper, key vault, Resend, Turnstile, R2, cookie
    # scope, base URL) as real environment variables instead.
    env_file:
      - .env
    # !reset wipes the inherited list from docker-compose.yml; bare
    # `ports: []` would only APPEND nothing, which leaves the dev
    # 8000:8000 binding in place. Same applies to volumes — we drop
    # the source bind-mount so the prod image's own code is what runs.
    ports: !reset []
    volumes: !reset []
    networks:
      - default
      - web

  db:
    restart: unless-stopped
    # Strip the dev 5432:5432 host binding — postgres listens only on
    # the project's default Docker network in prod (harmonia's existing
    # postgres holds the host's :5432, so binding here would conflict
    # anyway).
    ports: !reset []
    networks:
      - default

  redis:
    restart: unless-stopped
    # Same as db — keep redis off the host port plane.
    ports: !reset []
    networks:
      - default

networks:
  web:
    external: true
